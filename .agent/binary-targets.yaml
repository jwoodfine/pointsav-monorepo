schema: foundry-binary-targets-v1
cluster: project-knowledge

targets:
  - product_id: app-mediakit-knowledge
    binary_name: app-mediakit-knowledge
    source_crate: app-mediakit-knowledge
    license: FSL-1.1-ALv2   # verified 2026-08-10 directly against
                             # pointsav-monorepo/app-mediakit-knowledge/Cargo.toml
                             # `[package] license = "FSL-1.1-ALv2"`. Corrects
                             # BRIEF-binary-distribution.md's 2026-06-30 product-listing
                             # note ("License: Apache 2.0"), which is stale relative to
                             # the source of record.
    license_tier: fsl
    class: os-image          # standalone self-contained appliance (Format B: QCOW2 that
                              # does not require os-infrastructure as a prerequisite —
                              # BRIEF-binary-distribution.md "Decisions locked" #4), matching
                              # the same class/layer/requires shape used for the other real
                              # standalone appliance products in the fleet: os-totebox,
                              # app-orchestration-slm/-command (project-totebox), and
                              # app-privategit-design (project-design) — cross-checked
                              # directly against both of those archives' binary-targets.yaml
                              # 2026-08-10, not inferred.
    layer: base
    requires: []
    platforms: [x86_64-unknown-linux-gnu]   # BETA is Linux x86_64 only per
                                             # BRIEF-binary-distribution.md "Decisions
                                             # locked" #5 — no macOS/Windows/AArch64 builds
                                             # until pipelines exist.
    soft_enabled: true
    notes: >
      Two formats, both live on software.pointsav.com since 2026-07-01 (BETA, no charge —
      price_cents: 0, payment_required: false; do not enable pricing without an explicit
      future outbox per BRIEF-binary-distribution.md). Format A (bare binary): a plain
      `cargo build --release --bin app-mediakit-knowledge` in bin/build-soft.sh produces
      this correctly. Format B (standalone QCOW2 appliance,
      os-mediakit/scripts/build-image.sh) is a separate downstream packaging step that
      bin/build-soft.sh does NOT run — same disclosed pipeline-gap shape as
      project-totebox's os-totebox/app-orchestration-* loader.img entries. soft_enabled
      stays true because Format A genuinely is buildable by the existing plain-cargo-build
      pipeline; Format B needs a human/manual build-image.sh run regardless of this flag.

      **Smoke-test result (2026-08-10, this session, first real end-to-end boot attempt
      of the built Format B artifact) — DID NOT BOOT TO A WORKING STATE.** Booted
      pointsav-monorepo/os-mediakit/scripts/build/os-mediakit.qcow2 (sha256
      cf7b2dc45f5ca88831a99ece97a906709820bc4a69ccc4c2d294e7ca4b23475f) headless under
      qemu-system-x86_64 (`-snapshot`, so the artifact itself was not mutated — confirmed
      via matching sha256 before/after), hostfwd'd to alternate ports to avoid the live
      production-adjacent services already bound to 9090/9093/9095 on this host. Kernel,
      GRUB, and the root filesystem (mounted by PARTUUID) all came up cleanly — but
      `/dev/disk/by-label/BOOT` and a second by-label device (`boot-efi.mount`'s
      dependency, log-truncated to "U…") both timed out after 90s, `local-fs.target`
      failed, and the guest dropped into emergency mode and stalled there (confirmed
      stable, unchanged, after 6+ minutes). The 3 wiki systemd units never start under
      this condition; all three /healthz endpoints were unreachable (curl: connection
      timed out) for the full observation window.
      `os-mediakit/scripts/build-image.sh` itself contains zero partition/label/mkfs
      logic — it only customizes an already-partitioned base Ubuntu cloud image via
      qemu-nbd — so this was either (a) a real defect already present in the shipped
      artifact, or (b) a udev/by-label-symlink timing artifact specific to slow
      QEMU/TCG software emulation (no /dev/kvm on this host).

      **UPDATE 2026-08-25 — Phase F root cause done, (a) ruled out.** Mounted the same
      artifact (sha256 re-verified unchanged) read-only via qemu-nbd and inspected the
      partition table/labels/fstab directly, without booting: GPT layout, filesystem
      labels (UEFI, BOOT), and /etc/fstab are all present, correctly formatted, and
      mutually consistent — no defect in the shipped image. This rules out (a) and
      leaves (b) — a TCG/udev timing artifact under software emulation — as the
      remaining explanation.

      **UPDATE 2026-08-25 (same day, later) — (b) confirmed and fixed; a second,
      previously-masked defect found and fixed; artifact rebuilt.** Added
      `systemd.device-timeout=300` to the kernel cmdline in `build-image.sh` (baked
      into every future build, not just a one-off patch) — confirmed via two separate
      boot tests (a hand-patched throwaway copy, then the real rebuilt artifact) that
      this eliminates the emergency-mode failure: by-label devices are found
      immediately, `local-fs.target` succeeds, boot reaches the login prompt cleanly.
      This also surfaced a **second, independent defect** that hypothesis (a)'s
      emergency-mode failure had been masking: the three `wiki-*.service` units were
      gated on `network-online.target` (`After=`/`Wants=`), which — separately from
      the device-timeout issue — never completes under this host's QEMU/TCG+slirp
      test networking (`systemd-networkd-wait-online.service` hangs with no timeout),
      so the wiki processes never even attempted to start. Fixed in `build-image.sh`:
      changed the unit dependency to `network.target` (the app binds `0.0.0.0`
      locally and doesn't need DHCP/DNS resolved first). Confirmed via a full
      end-to-end rebuild + boot test: all three `wiki-{documentation,projects,
      corporate}.service` units now show `Started` in the boot log (previously: zero
      mentions of any wiki unit anywhere in the log — they never fired at all).
      Also found and fixed, incidentally, while rebuilding: `build-image.sh`'s
      hardcoded `IMAGE_SIZE="2G"` default was smaller than the current upstream
      Ubuntu 24.04 minimal cloud image's own virtual size (3.5 GiB, grown since this
      pipeline was written), which corrupts the GPT backup header on any default
      build — script now auto-detects `IMAGE_SIZE` from the downloaded base image.

      **Still unverified: end-to-end HTTP reachability.** With both fixes applied,
      the rebuilt artifact (sha256
      921fcb8b2602d27c7146d50aa202114c776f85471924cc522a8310f8f261eb59) boots cleanly
      and starts all three wiki services, but `/healthz` on all three hostfwd'd ports
      still timed out (curl exit 28, connection timeout — not connection refused)
      after 3 separate attempts up to 30s each. No DHCP/link-up evidence appears in
      the captured serial log either way. Most likely explanation, consistent with
      the same TCG/software-emulation class of artifact already identified for the
      original defect (no `/dev/kvm` on this host): the guest's virtio-net interface
      had not yet completed a slirp DHCP lease by the time of the check, which would
      make host→guest hostfwd forwarding fail regardless of application readiness.
      **Not yet confirmed either way** — needs either a longer soak or a
      KVM-capable-host retest before "Format B is live and working end-to-end" can be
      called confirmed. Full detail in BRIEF-os-mediakit-product-family.md's
      Decisions-open #7.
