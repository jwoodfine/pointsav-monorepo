<!--
  Operator feedback (2026-08-04): /tokens had no persistent navigation -- only a
  .domain-jump pill row that scrolled out of view, easy to get lost in with 5 tiers /
  25 groups / 661 leaf tokens on one long page. This sidebar replaces it: tier + group
  links, kept in sync with scroll position by static/tokens-scrollspy.js toggling
  .active client-side (unlike nav.html's server-rendered .active -- this page is one
  continuous scroll, not a series of separate page loads, so there's no server-known
  "active" item until the user actually scrolls).

  Restyled 2026-08-04 (operator: didn't visually match /components) onto the shared
  .doc-toc* class family both sidebars now use -- see nav.html for the full design
  rationale (Fable+Opus reviewed, synthesized by hand). The old top "TIERS" eyebrow
  is dropped for the same reason nav.html drops "COMPONENTS": aria-label on the
  <nav> wrapper in shell.html carries the section identity instead.

  Single-group tiers skip the nested list entirely and link the tier heading
  straight at that one group -- a lonely one-item indent under a header reads as a
  rendering defect, not real structure. (No tier is single-group as of 2026-08-04's
  "wcp" pillar retirement, but the logic stays generic for whatever lands next.)
-->
<ul class="doc-toc">
{% for tier in tiers %}
<li class="doc-toc__group">
{% if tier.groups | length == 1 %}
{% for group in tier.groups %}
<a href="#{{ tier.name }}-{{ group.name }}" class="doc-toc__group-heading">{{ tier.name | to_title }}</a>
{% endfor %}
{% else %}
<a href="#{{ tier.name }}" class="doc-toc__group-heading">{{ tier.name | to_title }}</a>
<ul class="doc-toc__group-list">
{% for group in tier.groups %}
<li><a href="#{{ tier.name }}-{{ group.name }}">{{ group.name | to_title }}</a></li>
{% endfor %}
</ul>
{% endif %}
</li>
{% endfor %}
</ul>
