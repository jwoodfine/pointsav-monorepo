[workspace]
resolver = "2"
# system-core and system-ledger declare their own [workspace] (standalone-extractable pattern;
# see .agent/rules/cleanup-log.md open question). Exclude prevents multi-workspace-root error
# when they are used as path dependencies from within this workspace.
# service-slm declares its own [workspace] too (5-crate nested workspace: slm-core,
# slm-doorman, slm-doorman-server, adapter-hub, slm-mcp-server). Excluded for the same
# reason, so os-totebox can path-depend on slm-doorman-server
# (BRIEF-os-totebox-platform.md §8/§10, Phase 2 dogfood bundle).
exclude = ["system-core", "system-ledger", "service-slm"]
members = [
    "service-people",
    "service-content",
    "app-console-content",
    "tool-acs-miner",
    "tool-buildingwidth",
    "tool-floorplate",
    "app-console-input",
    "system-gateway-mba",
    "service-fs",
    "system-security",
    "xtask",
    "console-core",
    "app-console-keys",
    "app-console-system",
    "app-console-email",
    "app-console-slm",
    "app-console-people",
    "os-console",
    "app-privategit-marketplace",
    "app-privategit-marketplace-2",
    "app-privategit-source",
    "app-privategit-source-2",
    "os-privategit",
    "tool-wallet",
    "app-privategit-workbench",
    "tool-proforma-engine",
    "app-orchestration-bim",
    "tool-keyplan",
    # PPN focus crates
    "system-substrate-broadcom",
    "system-network-interface",
    "os-network-admin",
    "app-network-admin",
    # PPN node-join ceremony
    "system-pairing-codes",
    "service-ppn-pairing",
    # PPN resource pooling
    "system-vm-fleet-types",
    "service-vm-fleet",
    "service-vm-host",
    "service-vm-tenant",
    # Knowledge wiki engine
    "app-mediakit-knowledge",
    # Jennifer ingest pipeline
    "service-input",
    "service-extraction",
    # BIM Object schema vault + MCP server
    "app-privategit-bim",
    # Marketing platform: shared chrome chassis + the marketing app
    "app-mediakit-shell",
    "app-mediakit-marketing",
    # Cross-archive DataGraph federation gateway (Phase 1 scaffold; port 9181)
    "app-orchestration-graph",
    # Marketing platform rewrite (parallel crate; swaps in at plan P8)
    "app-mediakit-marketing-2",
    # Design system browser (port 9094)
    "app-privategit-design",
    # Sovereign replacement stubs (wired into app-privategit-design)
    "moonshot-fs-watch",
    "moonshot-index",
    # os-console F5 Search cartridge
    "app-console-search",
    # mTLS Phase A public ingress
    "service-ingress",
    # Tier X — isolated external-LLM research/code-assist bridge (BRIEF-os-totebox-platform.md §7)
    "tool-llm-bridge",
    # os-totebox product bundle — dogfood on foundry-workspace (BRIEF-os-totebox-platform.md §10, Phase 2)
    "os-totebox",
    # Ring 1 email ingest — one mailbox folder into the DataGraph (BRIEF-os-totebox-platform.md §14 #21, Phase 3)
    "service-email",
]

[profile.dev]
panic = "abort"     # Required for bare-metal evaluation

[profile.release]
opt-level = "z"     # Optimize for minimum binary size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for maximum LTO benefit
panic = "abort"     # Strip panic unwinding overhead
strip = true        # Strip debug symbols from output binary

# app-mediakit-knowledge is a runtime HTTP server — use speed-optimised profile,
# not the bare-metal size-optimised defaults. Preserves the standalone Cargo.toml
# [profile.release] settings (moved here on workspace integration 2026-05-31).
[profile.release.package.app-mediakit-knowledge]
opt-level = 3
strip = "symbols"

# app-mediakit-marketing is a runtime HTTP server — speed-optimised, like the
# knowledge engine, not the bare-metal size-optimised workspace default.
[profile.release.package.app-mediakit-marketing]
opt-level = 3
strip = "symbols"

# app-mediakit-marketing-2 (rewrite) — same rationale as the crate it replaces.
[profile.release.package.app-mediakit-marketing-2]
opt-level = 3
strip = "symbols"

[patch.crates-io]
tantivy-common = { path = "vendor-tantivy-common" }
tantivy-columnar = { path = "vendor-tantivy-columnar" }
tantivy = { path = "vendor-tantivy" }
