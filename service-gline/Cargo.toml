[workspace]

[package]
name = "service-gline"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Rust-native GLiNER entity extraction shim (gline-rs / ONNX Runtime) — replaces the Python service-gliner microservice for seL4-hosted guest deployment. See BRIEF-os-totebox-platform.md Session 18."

[[bin]]
name = "service-gline"
path = "src/main.rs"

[dependencies]
gline-rs = "1.0.0"
orp = "0.9"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
