[package]
name = "service-content"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "service-content"
path = "src/main.rs"

[dependencies]
notify = "6.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
