[package]
license = "AGPL-3.0-or-later"
name = "service-content"
version = "0.1.0"
edition = "2021"

[lib]
name = "service_content"
path = "src/lib.rs"

[[bin]]
name = "service-content"
path = "src/main.rs"

[dependencies]
notify = "6.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"  # parses Command's user-pairings.yaml (O9 credential-chain wiring, read-only)
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
lbug = "0.16"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
strsim = "0.11"
ed25519-dalek = "2"
base64 = "0.22"
# lbug's vendored httplib is compiled with OpenSSL support whenever cmake's
# find_package(OpenSSL) succeeds on the build host (this VM has libssl-dev
# installed) — nothing else in this crate's own dependency graph links
# against libssl/libcrypto (reqwest here uses rustls-tls), so without this
# the final link fails with undefined OpenSSL symbols referenced from
# lbug's SSLClient code. openssl-sys's own build script emits the correct
# rustc-link-lib directives against the system OpenSSL already present.
openssl-sys = "0.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
wiremock = "0.6"

[features]
# Optional embedding-based entity resolution (bge-small-en-v1.5 via fastembed, CPU).
# Off by default so the standard build never depends on onnxruntime; the fastembed
# dependency is wired during the operator-validated activation step.
embeddings = []
