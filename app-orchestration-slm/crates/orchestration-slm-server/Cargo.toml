[package]
name = "orchestration-slm-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP entry point for the app-orchestration-slm Yo-Yo broker chassis"

[[bin]]
name = "orchestration-slm-server"
path = "src/main.rs"

[dependencies]
orchestration-slm-core = { workspace = true }
orchestration-slm = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
chrono = { workspace = true }
